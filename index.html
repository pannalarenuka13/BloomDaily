<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BloomDaily</title><meta name="theme-color" content="#e486ab"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BloomDaily"><link id="fav" rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link id="ati" rel="apple-touch-icon" sizes="192x192" href="./icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#fff7f3;--card:#fff;--ink:#4a3b47;--mut:#9a8896;--pk:#f9d3df;--pk2:#e486ab;--lv:#e8def7;--lv2:#a58bd1;--pe:#ffe6d6;--ok:#7bc79a;--pt:#f2c26b;--no:#e58a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2230;--card:#372d3f;--ink:#f3e8ee;--mut:#b9a6b5;--pk:#5e3a4e;--lv:#443a5c;--pe:#54403a}}
*{box-sizing:border-box}body{margin:0;font-family:'Quicksand','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;max-width:900px;margin:auto}
.brand{font-size:1.3rem;font-weight:700;color:var(--pk2)}.dn{display:flex;gap:6px;align-items:center}
main{max-width:900px;margin:auto;padding:0 14px 110px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 22px #c58fb01f;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h2,h3{margin:.2em 0}h3{font-size:1.05rem;color:var(--lv2)}small,em{color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--lv);background:var(--card);border-radius:12px;padding:8px 10px}
textarea{width:100%;min-height:80px;resize:vertical}input[type=number]{width:80px}
button{cursor:pointer;background:var(--lv)}button.pr{background:var(--pk2);color:#fff;border:0}button.on{background:var(--pk2);color:#fff;border-color:var(--pk2)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pk),var(--lv))}
.ring{position:relative;width:120px;height:120px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem}
.tr{fill:none;stroke:#fff8;stroke-width:10}.pg{fill:none;stroke:var(--pk2);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.tile{background:var(--pe);border-radius:16px;padding:10px}.tile b{display:block;font-size:1.25rem}
.task{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--lv)}
.sg{display:flex;gap:4px;flex:none}.sg button{padding:5px 8px;opacity:.5}.sg button.on{opacity:1}.sg .c.on{background:var(--ok)}.sg .p.on{background:var(--pt)}.sg .n.on{background:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border-radius:20px}
.ch{display:flex;gap:4px;height:180px;overflow-x:auto;padding-bottom:2px}.col{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.col small{font-size:.62rem;white-space:nowrap}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:70%;background:linear-gradient(var(--pk2),var(--lv2));border-radius:8px 8px 3px 3px;transition:height .5s}.gap{color:var(--mut)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg .h{font-size:.75rem;color:var(--mut)}.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cd{aspect-ratio:1;padding:0;border-radius:12px;background:transparent;border:1px solid var(--lv)}.cd.hi{background:var(--ok);color:#fff}.cd.md{background:var(--pt)}.cd.lo{background:var(--no);color:#fff}.cd.per{box-shadow:inset 0 0 0 3px var(--pk2)}.cd.sel{outline:2px solid var(--lv2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.hist{border-top:1px dashed var(--lv);padding:8px 0}
nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 12px));display:flex;background:var(--card);border-radius:22px;box-shadow:0 4px 24px #a58bd140;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;font-size:.62rem;padding:4px 1px;border-radius:14px}nav button span{display:block;font-size:1.25rem}nav button.on{background:var(--pk);color:inherit}
.brand{display:flex;align-items:center;gap:8px}.lg{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 2px 8px #c58fb040}
nav{overflow-x:auto;scrollbar-width:none}nav button{flex:1 0 62px}
.th{max-width:120px;max-height:120px;border-radius:12px;display:block;margin-top:6px;object-fit:cover}.th.bg{max-width:100%;max-height:none}.fl{display:inline-block;padding:8px 12px;border-radius:12px;background:var(--lv);cursor:pointer}
.hist{white-space:pre-wrap}input,select{max-width:100%}
</style></head><body>
