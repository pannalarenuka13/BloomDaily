calm:()=>`<h2 class="cch">Let’s slow down together 🍃</h2><div class="ccbr" id="ccbr">🌸</div><p id="ccbt" class="ccp">Ready when you are. In through the nose, out slowly, no holding your breath. If it feels uncomfortable, breathe in your own rhythm.</p><button class="ccb pr" id="ccbb" onclick="ccBrT()">Start slow breathing</button><button class="ccb" onclick="ccS('ground')">Try 5-4-3-2-1 grounding</button><small class="ccsm">If you have chest pain, trouble breathing that doesn’t ease, or feel faint, please skip this and <a href="#" onclick="ccS('sos','m');return false">get medical help</a>.</small>${ccBk}`,
mem:()=>{const K=[['mem','Happiest memories','🌷'],['ph','Photos','📷'],['song','Favourite songs','🎵'],['ppl','People who feel safe','🤍'],['lol','Things that make me laugh','😂'],['win','Proud of','🏆'],['msg','Messages to myself','💌']],h=K.map(k=>{const L=CC.m.filter(m=>m.k==k[0]);return L.length?`<h3>${k[2]} ${k[1]}</h3>${L.map(ccMI).join('')}`:''}).join('');return `<h2 class="cch">Your happy things 🌷</h2>${h||'<p class="ccp">You haven’t saved anything yet, and that’s okay. Add a few whenever you have the energy.</p><button class="ccb" onclick="ccClose();sw(\'ccm\')">Add something</button>'}${ccBk}`},
sos:k=>{const m=k=='m',ppl=CC.m.filter(x=>x.k=='ppl'&&/\d{5}/.test(x.x||''));return `<h2 class="cch">${m?'Your body may need care right now':'Your safety matters most right now'} 💗</h2><p class="ccp" style="font-size:1.05rem">${m?'Chest pain, breathing that stays difficult, fainting or suddenly feeling very unwell can be physical emergencies, even when you’re also upset. Please don’t wait it out or assume it’s only emotions. Call 112 (or an ambulance on 108) now, or ask someone nearby to take you to the nearest emergency room. Please try not to go alone.':'Thank you for telling me. You deserve support from a real person right now, not only from an app. If you might hurt yourself or you’re in danger, please call for help now, and if you can, move anything you might use to hurt yourself out of reach.'}</p><a class="ccb pr" href="tel:112">🚨 Emergency: call 112</a>${m?'<a class="ccb" href="tel:108">🚑 Ambulance: 108</a>':'<a class="ccb" href="tel:14416">📞 Tele-MANAS 14416 · free, 24×7</a><a class="ccb" href="tel:18005990019">📞 KIRAN 1800-599-0019 · free, 24×7</a>'}${ppl.map(x=>`<a class="ccb" href="tel:${esc(x.x.replace(/[^\d+]/g,''))}">🤍 Call ${esc(x.t)}</a>`).join('')}${m?'':'<p>If you can, tell someone near you or message a person you trust: “I’m not okay and I need you with me.” You don’t have to explain more.</p>'}<details><summary>Not in India?</summary><p>Call your local emergency number. US: 988. UK and Ireland: Samaritans 116 123. Elsewhere: findahelpline.com lists free lines by country.</p></details>${ccBk}`}};
function ccMI(m){return `<div class="ccpl" style="text-align:left">${m.p?`<img class="th bg" alt="Saved photo" data-i="cm${m.id}">`:''}${esc(m.t)}${m.x?`<br><small>${m.k=='ppl'&&/\d{5}/.test(m.x)?`<a href="tel:${esc(m.x.replace(/[^\d+]/g,''))}">📞 ${esc(m.x)}</a>`:esc(m.x)}</small>`:''}</div>`}
function ccFloat(){const t=$('#ccfl'),r=ccRisk(t.value);if(r)return ccS('sos',r);t.style.transition='all 4s ease-in';t.style.opacity=0;t.style.transform='translateY(-60px)';setTimeout(()=>{if($('#ccfl'))$('#ccst').innerHTML=`<h2 class="cch">…and it’s gone, for now ☁️</h2><p class="ccp">If it comes back, you can release it again. You don’t have to solve it tonight.</p><button class="ccb" onclick="ccS('ground')">Ground me next</button>${ccBk}`},3800)}
function ccAddJ(o){CC.j.push({id:uid(),t:new Date().toISOString(),...o});ccSave()}
function ccCry(s){const v=$('#ccwr').value.trim(),r=ccRisk(v);if(s&&v)ccAddJ({f:'Crying',x:v});r?ccS('sos',r):ccS('cry2')}
/* ---- app tabs ---- */
let ccf='',cci=-1,ccT='',ccJF='';
const ccPick=i=>{ccf=ccFE[i][0];cci=-1;render()},ccInt=i=>{cci=i;i==2?ccGo():render()},ccGo=()=>{const r=ccRisk(ccT);ccOpen(ccf,r?'sos':'home',r)};
function ccKeep(){if(!ccT.trim())return ccToast('Nothing to keep yet, and that’s okay.');ccAddJ({f:ccf,x:ccT});ccToast('Kept privately in your journal 💗');if(ccRisk(ccT))ccGo()}
V.cc=()=>`<div class="card ccc"><h2>Hey, what’s hurting your heart today? 💗</h2><small>No forms, no pressure. Pick a feeling, type something, or do neither.</small><div class="chips">${ccFE.map((f,i)=>`<button class="chip ${ccf==f[0]?'on':''}" onclick="ccPick(${i})">${f[1]} ${f[0]}</button>`).join('')}</div>${ccf?`<small>How strong is it?</small><div class="chips">${['A little','Quite a lot','Very much'].map((l,i)=>`<button class="chip ${cci==i?'on':''}" onclick="ccInt(${i})">${l}</button>`).join('')}</div>`:''}<div><textarea placeholder="Write anything, as messy as it comes. You never have to explain." oninput="ccT=this.value;ccScan(this)">${esc(ccT)}</textarea>${ccBn}</div><div class="row"><button class="pr" onclick="ccGo()">Be with me 💗</button><button onclick="ccOpen('Sad')">I’m very sad right now</button><button onclick="ccKeep()">Keep this in my journal</button></div></div>
<div class="card ccc"><h3>My Healing Garden 🌼</h3><small>It grows a little each time you plant something here. <b class="ccgn">${CC.g.length}</b> so far. It never depends on how you feel.</small><div class="mdw" style="margin-top:8px">${ccMd()}</div><div class="row"><button onclick="ccPlant('f')">🌸 Flower</button><button onclick="ccPlant('l')">✨ Soft light</button><button onclick="ccPlant('b')">🦋 Butterfly</button></div></div>
<div class="card ccc"><div class="row"><button onclick="sw('ccbox')">🎁 Rescue Box</button><button onclick="sw('ccj')">📝 Journal</button><button onclick="sw('ccm')">🌷 Happy memories</button><button onclick="sw('ccs')">🌿 Self-care</button></div><div class="row"><button onclick="CC.st.mute=!!ccMT;ccMus(!ccMT);ccSave();render()">🎵 Soft music: ${ccMT?'on (tap to mute)':'off'}</button><button onclick="ccOpen('','sos')">I don’t feel safe or can’t cope</button></div></div>`;
V.ccbox=()=>`<div class="card ccc" style="text-align:center"><h3>Happiness Rescue Box 🎁</h3><small>Tap for a small surprise. Nothing to earn, nothing to finish, and it won’t repeat the same thing too soon.</small><div style="font-size:4rem;margin:8px">🎁</div><button class="pr" onclick="ccBox('ccr','')">Open the box</button><div id="ccr" style="margin-top:10px"></div></div>`;
const ccJP=['What happened?','What do you wish someone understood?','What do you need right now?'];
const ccJf=(b,f)=>{ccJF=ccJF==f?'':f;b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b&&ccJF==f))};
function ccJS(){const v=[0,1,2].map(i=>$('#ccjp'+i).value.trim()),x=$('#ccjx').value.trim(),all=v.join(' ')+' '+x;if(!all.trim())return ccToast('Nothing to save yet, and that’s okay.');ccAddJ({f:ccJF,a:v[0],b:v[1],c:v[2],x});ccJF='';const r=ccRisk(all);r?(render(),ccOpen('','sos',r)):(ccToast('Saved privately 💗'),render())}
const ccJD=id=>{if(confirm('Delete this entry? This can’t be undone.')){CC.j=CC.j.filter(j=>j.id!=id);ccSave();render()}};
V.ccj=()=>`<div class="card ccc"><h3>My feelings journal 📝</h3><small>Private, kept only on this device. Nothing here is right or wrong, and nothing needs a positive ending.</small><div class="chips">${ccFE.map(f=>`<button class="chip" onclick="ccJf(this,'${f[0].replace('’','')}')">${f[1]} ${f[0]}</button>`).join('')}</div>${ccJP.map((p,i)=>`<p style="margin:8px 0 2px"><b>${p}</b></p><textarea id="ccjp${i}" style="min-height:64px" oninput="ccScan(this)"></textarea>`).join('')}<p style="margin:8px 0 2px"><b>Anything else</b></p><div><textarea id="ccjx" oninput="ccScan(this)"></textarea>${ccBn}</div><div class="row"><button class="pr" onclick="ccJS()">Save privately</button></div></div><div class="card"><h3>My past entries</h3><small>Tap one to open it whenever you want.</small>${CC.j.slice().reverse().map(j=>`<details><summary>${fD(iso(new Date(j.t)),1)}${j.f?' · '+esc(j.f):''}</summary><div class="hist">${[['What happened?',j.a],['What I wish someone understood',j.b],['What I need right now',j.c],['',j.x]].filter(z=>z[1]).map(z=>`${z[0]?`<small>${z[0]}</small><br>`:''}${esc(z[1])}<br>`).join('')}</div><button onclick="ccJD('${j.id}')">Delete</button></details>`).join('')||'<p><small>No entries yet. Whenever you’re ready.</small></p>'}</div>`;
const ccKD=[['mem','Happiest memories','🌷'],['ph','Photos','📷'],['song','Favourite songs','🎵'],['ppl','People who make me feel safe','🤍'],['lol','Things that make me laugh','😂'],['win','Achievements I’m proud of','🏆'],['msg','Messages to myself for hard days','💌']];
const ccPh=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)});
async function ccMSave(){const k=$('#ccmk').value,t=$('#ccmt').value.trim(),x=$('#ccmx').value.trim(),f=$('#ccmf').files[0],o={id:uid(),k,t,x};if(!t&&!(f&&k=='ph'))return ccToast('Add a few words or a photo first.');if(f&&k=='ph'){const u=await ccPh(f);if(u){await kvs('img:cm'+o.id,u);o.p=1}}CC.m.push(o);ccSave();render();ccToast('Saved 🌷')}
const ccMDel=id=>{if(!confirm('Remove this?'))return;kvs('img:cm'+id,null);CC.m=CC.m.filter(m=>m.id!=id);ccSave();render()},ccMkc=()=>{$('#ccmw').hidden=$('#ccmk').value!='ph'};
V.ccm=()=>`<div class="card ccc"><h3>My happy memories 🌷</h3><small>Private, and only shown in your Comfort Corner when you choose to open them.</small><div class="row"><select id="ccmk" onchange="ccMkc()">${ccKD.map(k=>`<option value="${k[0]}">${k[2]} ${k[1]}</option>`).join('')}</select></div><input id="ccmt" style="width:100%" placeholder="Write it here…"><input id="ccmx" style="width:100%;margin-top:6px" placeholder="Optional: artist, or a phone number for someone safe"><div id="ccmw" hidden style="margin-top:6px"><input type="file" id="ccmf" accept="image/*"></div><div class="row"><button class="pr" onclick="ccMSave()">Save</button></div></div>${ccKD.map(k=>{const L=CC.m.filter(m=>m.k==k[0]);return `<div class="card"><details><summary>${k[2]} ${k[1]} (${L.length})</summary>${L.map(m=>`<div class="hist">${ccMI(m)}<button onclick="ccMDel('${m.id}')">Remove</button></div>`).join('')||'<small>Nothing here yet. Add whenever you like.</small>'}</details></div>`}).join('')}`;
const ccSP=i=>{const t=CC.sc[today()]=CC.sc[today()]||{};t[i]=1;ccSave();render();ccToast('That counts. Be gentle with yourself 🤍')},ccSPick=()=>{$('#ccsp').textContent='How about: '+ccSC[ccDraw('sp',ccSC.length)]+'  (or nothing at all, that’s okay)'};
async function ccExp(){const im={};for(const m of CC.m)if(m.p){const u=await kvg('img:cm'+m.id);if(u)im[m.id]=u}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({comfort:1,data:CC,imgs:im})]));a.download='bloomdaily-comfort-backup.json';document.body.appendChild(a);a.click();a.remove()}
function ccImp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o.comfort)throw 0;CC={...CC,...o.data};for(const k in o.imgs||{})await kvs('img:cm'+k,o.imgs[k]);ccSave();render();ccToast('Restored 💗')}catch(e){ccToast('That doesn’t look like a Comfort Corner backup.')}};r.readAsText(f)}
V.ccs=()=>{const t=CC.sc[today()]||{};return `<div class="card ccc"><h3>Gentle self-care 🌿</h3><small>Pick one small thing, or none at all. There’s no list to finish and nothing to feel bad about.</small><p id="ccsp" style="min-height:1.4em"></p><button onclick="ccSPick()">Pick one for me</button>${ccSC.map((s,i)=>`<div class="task"><span>${s}</span><button class="${t[i]?'on':''}" onclick="ccSP(${i})">${t[i]?'Lovely 🤍':'I’ll try this'}</button></div>`).join('')}</div><div class="card"><h3>Back up my Comfort Corner</h3><small>Your journal and memories live only on this device. Keep a private copy if you like.</small><div class="row"><button onclick="ccExp()">Export</button><label class="fl">Restore<input type="file" accept=".json" hidden onchange="ccImp(this.files[0])"></label></div></div>`};
/* ---- connections to the rest of BloomDaily ---- */
const _ccTd=V.today;V.today=()=>`<div class="card ccc" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>💗 Comfort Corner</b><br><small>${G(cur).mood.some(m=>/Sad|Crying|Anxious|Overwhelmed|Angry|Emotional/.test(m))?'Today feels heavy. Come sit somewhere soft for a while.':'A soft place for heavy days. No pressure, ever.'}</small></div><button class="pr" onclick="sw('cc')">Open</button></div>`+_ccTd();
const _ccGd=V.garden;V.garden=()=>_ccGd()+`<div class="card"><h3>Healing garden 🌼</h3><small>Grown from your Comfort Corner visits, <b class="ccgn">${CC.g.length}</b> so far. It never depends on how you feel.</small><div class="mdw" style="margin-top:8px">${ccMd()}</div><div class="row"><button onclick="sw('cc')">Open Comfort Corner</button></div></div>`;
function ccHook(){if(!CCTABS.includes(tab)){ccClose();ccMus(false)}}
</script></body></html>
